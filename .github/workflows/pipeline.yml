name: 🚀 Magic AI Pipeline - CI/CD

on:
  push:
    branches: [main, develop, wip/local-sync-2026-10-16]
  pull_request:

env:
  NODE_VERSION: "22.13.0"

jobs:
  # ============================================================================
  # JOB 1: VALIDAÇÃO E TESTES
  # ============================================================================
  validate-and-test:
    name: 🧪 Validação e Testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: MTG_TEST
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📚 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🔍 Lint code
        run: npm run lint

      - name: 🔎 Typecheck
        run: npm run check

      - name: 🧪 Run tests
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/MTG_TEST
        run: npm test

      - name: ✅ Validate critical fixes
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/MTG_TEST
        run: npm run test:critical-fixes --if-present

  # ============================================================================
  # JOB: ml_engine pytest (CPU). Ray is optional; tests importorskip it.
  # ============================================================================
  ml-engine:
    name: 🐍 ml_engine pytest
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📚 Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy gymnasium psycopg2-binary jsonschema referencing
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torch-geometric

      - name: 🧪 pytest ml_engine
        env:
          # test_arena_pool leaks DATABASE_URL. Without this, match_record
          # opens Postgres with no timeout and pytest hangs. The leak itself
          # is fixed in a separate PR.
          FORGE_MATCH_RECORD: "0"
        run: python -m pytest ml_engine -q

      - name: 🧪 bridge_v2 schemas
        run: python schemas/bridge_v2/validate.py

      - name: 🧪 Java rlbridge protocol tests
        run: bash rlbridge_src/test-protocol.sh

  # Compiles the bridge against Forge 7cc4ff7b and plays a short live match.
  forge-live:
    name: ☕ Forge live smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Checkout Forge 7cc4ff7b
        uses: actions/checkout@v4
        with:
          repository: Card-Forge/forge
          ref: 7cc4ff7b17365c7e882cb472537c5ccdda0dbde0
          path: forge-src

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: forge-src/**/pom.xml

      - name: 📦 Maven
        run: |
          if ! command -v mvn >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y maven
          fi
          mvn -version

      - name: 🏗️ Build forge-gui-desktop
        working-directory: forge-src
        run: mvn -pl forge-gui-desktop -am package -DskipTests

      - name: 🏗️ Compile rlbridge
        run: |
          JAR=forge-src/forge-gui-desktop/target/forge-gui-desktop-2.0.12-SNAPSHOT-jar-with-dependencies.jar
          mkdir -p /tmp/rlbridge-classes
          javac --release 17 -cp "$JAR" -d /tmp/rlbridge-classes \
            rlbridge_src/src/main/java/forge/rlbridge/ProtocolV2.java \
            rlbridge_src/src/main/java/forge/rlbridge/DecisionHandoff.java \
            rlbridge_src/src/main/java/forge/rlbridge/ExternalPlayerController.java \
            rlbridge_src/src/main/java/forge/rlbridge/ForgeRLBridge.java
          jar cf /tmp/rlbridge.jar -C /tmp/rlbridge-classes .

      - name: 🐍 Live smoke
        env:
          PYTHONPATH: ${{ github.workspace }}
          FORGE_MATCH_RECORD: "0"
          FORGE_JAR: forge-src/forge-gui-desktop/target/forge-gui-desktop-2.0.12-SNAPSHOT-jar-with-dependencies.jar
          FORGE_BRIDGE_JAR: /tmp/rlbridge.jar
          FORGE_ASSETS_DIR: forge-src/forge-gui
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy gymnasium
          python ml_engine/scripts/live_smoke.py --episodes 1 --resets 3 --bc-games 1 --turn-limit 12

  # ============================================================================
  # JOB 2: BUILD E ANÁLISE
  # ============================================================================
  build-and-analyze:
    name: 🏗️ Build e Análise
    runs-on: ubuntu-latest
    needs: validate-and-test

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📚 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🏗️ Build project
        run: npm run build

      # Non-breaking fixes are applied in the lockfile. These advisories stay
      # because the patched release is a semver-major jump:
      # - GHSA-gpj5-g38j-94v9 drizzle-orm 0.45 (SQL identifier escaping)
      # - vitest 5, and the vite/tinypool copies it pins (dev-only test runner)
      - name: 🔐 Security audit
        run: |
          set +e
          npm audit --audit-level=high --legacy-peer-deps --json > "$RUNNER_TEMP/npm-audit.json"
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi
          node --input-type=module -e '
          import { readFileSync } from "node:fs";
          const allow = new Set([
            "GHSA-gpj5-g38j-94v9",
            "GHSA-5gmw-xhrv-c9v3",
            "GHSA-85c8-ppgw-ccpr",
            "GHSA-4w7w-66w2-5vf9",
            "GHSA-v6wh-96g9-6wx3",
            "GHSA-fx2h-pf6j-xcff",
            "GHSA-5xrq-8626-4rwp",
            "GHSA-82fw-gwwq-j7x9",
          ]);
          const report = JSON.parse(readFileSync(process.env.AUDIT_JSON, "utf8"));
          const blocked = [];
          for (const [name, info] of Object.entries(report.vulnerabilities ?? {})) {
            if (info.severity !== "high" && info.severity !== "critical") continue;
            const ids = [];
            for (const via of info.via ?? []) {
              if (via && typeof via === "object" && via.url) {
                const id = String(via.url).split("/").pop();
                if (id) ids.push(id);
              }
            }
            const unexpected = ids.filter((id) => !allow.has(id));
            if (ids.length === 0 || unexpected.length > 0) {
              blocked.push(
                info.severity + " " + name + ": " + (unexpected.join(", ") || "unlisted")
              );
            }
          }
          if (blocked.length) {
            console.error("High or critical advisories outside the documented exception list:");
            for (const line of blocked) console.error(" - " + line);
            process.exit(1);
          }
          console.log("No unallowlisted high or critical advisories.");
          '
        env:
          AUDIT_JSON: ${{ runner.temp }}/npm-audit.json

  # ============================================================================
  # JOB 3: RELATÓRIO FINAL
  # ============================================================================
  report:
    name: 📋 Relatório Final
    runs-on: ubuntu-latest
    needs: [validate-and-test, build-and-analyze, ml-engine, forge-live]
    if: always()

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📊 Generate report
        run: |
          echo "# 🚀 Magic AI Pipeline - Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Status" >> $GITHUB_STEP_SUMMARY
          echo "- Validation: ${{ needs.validate-and-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- ml_engine: ${{ needs.ml-engine.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- forge-live: ${{ needs.forge-live.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build-and-analyze.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Commit Info" >> $GITHUB_STEP_SUMMARY
          echo "- SHA: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Author: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

      # Restricted exception: commenting is not a quality gate. A missing
      # pull-request permission must not turn a green pipeline red.
      - name: 💬 Comment on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Magic AI Pipeline\n\nValidation: ${{ needs.validate-and-test.result }}\nBuild: ${{ needs.build-and-analyze.result }}`
            })
