name: 📊 Data Pipeline - Scheduled Training

on:
  schedule:
    # Executar pipeline de dados diariamente às 2 AM UTC
    - cron: '0 2 * * *'
    # Executar a cada segunda-feira às 3 AM UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      format:
        description: 'Deck format'
        required: false
        default: 'modern'
        type: choice
        options:
          - standard
          - modern
          - commander
          - legacy
      decks:
        description: 'Number of decks to import'
        required: false
        default: '50'
        type: string
      min_complete_pct:
        description: 'Gate: minimum % of complete decks imported in this run (default vars.MIN_COMPLETE_DECK_PCT or 95)'
        required: false
        default: ''
        type: string

env:
  NODE_VERSION: '22.13.0'
  # Gate threshold: workflow_dispatch input > repo variable > 95.
  MIN_COMPLETE_DECK_PCT: ${{ github.event.inputs.min_complete_pct || vars.MIN_COMPLETE_DECK_PCT || '95' }}
  DATABASE_URL: postgresql://postgres:${{ secrets.DB_PASSWORD || 'test_password' }}@localhost:5432/MTG

# Minimum permissions: issues:write only to open or update the failure issue.
permissions:
  contents: read
  issues: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  data-pipeline:
    name: 📊 Full Data Pipeline
    runs-on: ubuntu-latest
    # MTGTop8 policy: external scraping only on schedule/manual dispatch, never
    # in pull_request (the triggers above already exclude it; this guard keeps
    # it that way if someone adds a trigger).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD || 'test_password' }}
          POSTGRES_DB: MTG
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🧩 Enable pgvector
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD || 'test_password' }}
        run: psql -h localhost -U postgres -d MTG -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      # Called directly: package.json has no "migrate" script, so the old
      # `npm run migrate --if-present` was a silent no-op.
      - name: 🗄️ Run migrations
        run: npx tsx server/scripts/applyMigration.ts

      # MTGGoldfish import removed: source dropped (anti-scraper), and the step
      # was continue-on-error, so it could never fail the run.

      # Mark the run start in the DB clock: the gate counts only decks with
      # imported_at >= this instant (decks imported in this run).
      - name: ⏱️ Mark run start
        id: runstart
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD || 'test_password' }}
        run: echo "ts=$(psql -h localhost -U postgres -d MTG -v ON_ERROR_STOP=1 -At -c 'SELECT now()::timestamptz')" >> "$GITHUB_OUTPUT"

      - name: 💾 Cache MTGTop8 responses
        uses: actions/cache@v4
        with:
          path: .cache/mtgtop8
          key: mtgtop8-${{ github.event.inputs.format || 'modern' }}-${{ github.run_id }}
          restore-keys: mtgtop8-${{ github.event.inputs.format || 'modern' }}-

      # Polite import: robots.txt checked before any download, at most one
      # request per 2 s, responses cached for 24 h. Fails if nothing was imported.
      - name: 📥 Import MTGTop8
        id: import
        env:
          IMPORT_FORMAT: ${{ github.event.inputs.format || 'modern' }}
          IMPORT_LIMIT: ${{ github.event.inputs.decks || '50' }}
          MTGTOP8_CHECK_ROBOTS: '1'
          MTGTOP8_MIN_DELAY_MS: '2000'
          MTGTOP8_CACHE_DIR: .cache/mtgtop8
          MTGTOP8_CACHE_TTL_HOURS: '24'
          MTGTOP8_USER_AGENT: 'mtg-deck-mvp-data-pipeline/1.0 (+https://github.com/${{ github.repository }})'
        run: |
          npx tsx -e "
            import('./server/services/mtgtop8Scraper.ts').then(async (m) => {
              const r = await m.importMTGTop8Decks(process.env.IMPORT_FORMAT, Number(process.env.IMPORT_LIMIT));
              console.log(JSON.stringify({ imported: r.decksImported, skipped: r.decksSkipped, cards: r.cardsImported, errors: r.errors.length }));
              if (r.errors.length) console.error(r.errors.slice(0, 10).join('\\n'));
              process.exit(r.decksImported > 0 ? 0 : 1);
            }).catch((e) => { console.error(e); process.exit(1); });
          "

      # Called directly (package.json has no "audit:data-quality" script).
      # Read-only: no --apply. A crash fails the run.
      - name: ✅ Validate data quality
        run: npx tsx server/scripts/sanitizeTrainingData.ts

      # Measures only this run. The real-DB gate runs on Alan's PC with
      # scripts/sql/diagnostico_decks_incompletos.sql.
      - name: 🚦 Gate - complete decks (this run)
        id: gate
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD || 'test_password' }}
          RUN_START: ${{ steps.runstart.outputs.ts }}
        run: |
          read -r total complete < <(psql -h localhost -U postgres -d MTG -v ON_ERROR_STOP=1 -At -F ' ' -c "
            WITH a AS (
              SELECT deck_id,
                     COALESCE(SUM(quantity) FILTER (WHERE COALESCE(section,'mainboard')='mainboard'),0) AS m,
                     COALESCE(SUM(quantity) FILTER (WHERE section='sideboard'),0) AS s
              FROM competitive_deck_cards GROUP BY deck_id)
            SELECT COUNT(*),
                   COUNT(*) FILTER (WHERE NOT COALESCE(d.is_synthetic,false)
                     AND a.m = CASE WHEN lower(d.format)='commander' THEN 100 ELSE 60 END
                     AND a.s <= CASE WHEN lower(d.format)='commander' THEN 0 ELSE 15 END)
            FROM competitive_decks d LEFT JOIN a ON a.deck_id = d.id
            WHERE d.imported_at >= '${RUN_START}'::timestamptz;")
          if [ "${total:-0}" -eq 0 ]; then echo "::error::No decks imported in this run"; exit 1; fi
          pct=$(awk -v c="$complete" -v t="$total" 'BEGIN { printf "%.1f", 100*c/t }')
          echo "Complete decks (this run): $complete/$total ($pct%), threshold ${MIN_COMPLETE_DECK_PCT}%"
          echo "- Complete decks (this run): $complete/$total ($pct%), threshold ${MIN_COMPLETE_DECK_PCT}%" >> "$GITHUB_STEP_SUMMARY"
          if awk -v p="$pct" -v m="$MIN_COMPLETE_DECK_PCT" 'BEGIN { exit !(p < m) }'; then
            echo "::error::Complete decks ${pct}% below threshold ${MIN_COMPLETE_DECK_PCT}%"; exit 1
          fi

      # Training steps removed: train:embeddings, train:brain and train:rl do
      # not exist in package.json, so with --if-present + continue-on-error they
      # always passed without doing anything. Real training needs Forge/Java and
      # a GPU (train:ray*, embed:cards) and runs off CI. Put it back as its own
      # job, with gates, once there is a runner for it.

      - name: 📊 Generate statistics
        run: npm run stats:pipeline --if-present

      - name: 🐛 Open/update failure issue
        if: failure() && (steps.import.outcome == 'failure' || steps.gate.outcome == 'failure')
        uses: actions/github-script@v7
        env:
          IMPORT_OUTCOME: ${{ steps.import.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        with:
          script: |
            const title = 'Data pipeline: MTGTop8 import or complete-deck gate failed';
            const label = 'data-pipeline-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Run: ${runUrl}\nImport: ${process.env.IMPORT_OUTCOME}\nGate: ${process.env.GATE_OUTCOME}`;
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'd73a4a' });
            }
            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', labels: label, per_page: 100,
            });
            const existing = open.find((i) => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
              core.info(`Commented on existing issue #${existing.number}`);
            } else {
              const { data } = await github.rest.issues.create({ ...context.repo, title, body, labels: [label] });
              core.info(`Opened issue #${data.number}`);
            }

      - name: 📋 Create summary
        if: always()
        run: |
          echo "# 📊 Data Pipeline Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Pipeline Execution" >> $GITHUB_STEP_SUMMARY
          echo "- Format: ${{ github.event.inputs.format || 'modern' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Decks: ${{ github.event.inputs.decks || '50' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: pipeline-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7

      # Notifications only: continue-on-error stays so a missing or invalid
      # SLACK_WEBHOOK can't flip the pipeline result. It hides no data failure.
      - name: 💬 Slack notification
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "❌ Magic AI Data Pipeline Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Magic AI Data Pipeline*\n❌ Pipeline execution failed\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }
        continue-on-error: true

      - name: ✅ Success notification
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "✅ Magic AI Data Pipeline Completed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Magic AI Data Pipeline*\n✅ Pipeline execution completed successfully\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }
        continue-on-error: true


