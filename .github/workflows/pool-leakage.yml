name: pool-leakage

# Leakage gate for the committed pool manifests (data/pools/*): no deck_hash or
# group_id in more than one split, max Jaccard between splits < 0.8, manifest
# hash intact. Pure file check, no database.
on:
  pull_request:
    paths:
      - "data/pools/**"
      - "server/services/poolV3*.ts"
      - "server/services/poolMembershipRows.ts"
      - "server/scripts/buildPoolV3.ts"
      - ".github/workflows/pool-leakage.yml"
  push:
    branches: [main]
    paths:
      - "data/pools/**"
      - "server/services/poolV3*.ts"

permissions:
  contents: read

jobs:
  leakage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Pool v3 unit + leakage tests
        run: npx vitest run server/services/poolV3.test.ts server/services/poolV3.leakage.test.ts
